[dependencies]
gleam_json = ">= 3.0.1 and < 4.0.0"
birl = ">= 1.8.0 and < 2.0.0"
gleam_stdlib = ">= 0.61.0 and < 1.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
